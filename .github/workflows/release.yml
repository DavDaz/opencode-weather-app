name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.release.outputs.should-release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check version and existing release
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(bun -e '
            const packageJson = await Bun.file("package.json").json();
            const version = packageJson.version;
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;

            if (typeof version !== "string" || !semver.test(version)) {
              throw new Error("package.json version must be a valid SemVer string");
            }

            process.stdout.write(version);
          ')

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            previous_version=""
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git cat-file -e "${BEFORE_SHA}^{commit}"
            previous_version=$(git show "${BEFORE_SHA}:package.json" | bun -e '
              const packageJson = JSON.parse(await Bun.stdin.text());

              if (!Object.hasOwn(packageJson, "version")) {
                process.exit(0);
              }

              const version = packageJson.version;
              const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;

              if (typeof version !== "string" || !semver.test(version)) {
                throw new Error("previous package.json version is not valid SemVer");
              }

              process.stdout.write(version);
            ')
          else
            echo "Invalid before SHA: $BEFORE_SHA" >&2
            exit 1
          fi

          tag="v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ -z "$version" ] || [ "$version" = "$previous_version" ]; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should-release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should-release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: bun-linux-x64
            executable: weather
            archive: weather-linux-x64.tar.gz
          - os: macos-latest
            platform: macos-arm64
            target: bun-darwin-arm64
            executable: weather
            archive: weather-macos-arm64.tar.gz
          - os: macos-15-intel
            platform: macos-x64
            target: bun-darwin-x64
            executable: weather
            archive: weather-macos-x64.tar.gz
          - os: windows-latest
            platform: windows-x64
            target: bun-windows-x64
            executable: weather.exe
            archive: weather-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build native executable
        run: bun run build -- --target=${{ matrix.target }}
      - name: Package executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "${{ matrix.executable }}"
          tar -czf "${{ matrix.archive }}" "${{ matrix.executable }}"
      - name: Package executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.executable }}" -DestinationPath "${{ matrix.archive }}"
      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: weather-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: weather-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes --title "$TAG"
